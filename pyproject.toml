[project]
name = "adsb-fingerprint"
version = "0.1.0"
description = "RF fingerprinting of ADS-B transponders from RTL-SDR captures, after US 2022/0217619 A1"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "numpy",
    "pandas",
    "psycopg[binary]",
    "pyModeS",
    "pyrtlsdr[lib]",
    "python-dotenv",
    "pyyaml",
    "scipy",
    "torch",
    "tqdm",
]

[project.scripts]
adsb-capture = "adsb_fingerprint.capture:main"
adsb-collect = "adsb_fingerprint.collect:main"
adsb-dataset = "adsb_fingerprint.dataset:main"
adsb-eval = "adsb_fingerprint.evaluate:main"
adsb-index = "adsb_fingerprint.index:main"
adsb-info = "adsb_fingerprint.info:main"
adsb-ingest-faa = "adsb_fingerprint.ingest_faa:main"
adsb-ingest-opensky = "adsb_fingerprint.ingest_opensky:main"
adsb-initdb = "adsb_fingerprint.db:main"
adsb-stats = "adsb_fingerprint.stats:main"
adsb-train = "adsb_fingerprint.train:main"
adsb-variance = "adsb_fingerprint.variance:main"
adsb-web = "adsb_fingerprint.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsb_fingerprint"]
