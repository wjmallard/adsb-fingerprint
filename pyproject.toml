[project]
name = "adsb-fingerprint"
version = "0.1.0"
description = "RF fingerprinting of ADS-B transponders from RTL-SDR captures, after US 2022/0217619 A1"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "psycopg[binary]",
    "pyModeS",
    "pyrtlsdr[lib]",
    "python-dotenv",
    "pyyaml",
    "scipy",
    "tqdm",
]

[project.scripts]
adsb-initdb = "adsb_fingerprint.db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsb_fingerprint"]
