<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS-B Live Map</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="map">
        <div id="status-chip" class="chip">connecting…</div>
        <div id="gain-chip" class="chip" hidden>
            listen · gain
            <select id="gain-select"></select>
            <span id="gain-pending"></span>
        </div>
    </div>
    <div id="panels">
        <section id="roster">
            <header>
                roster <span id="roster-count"></span>
                <nav class="page-nav">
                    <a href="/live">live id</a>
                    <a href="/aircraft">aircraft</a>
                    <a href="/activity">activity</a>
                    <a href="/samples">samples</a>
                    <a href="/embeddings">embeddings</a>
                </nav>
            </header>
            <div class="row head">
                <span class="dot"></span>
                <span class="icao">icao</span>
                <span class="callsign">flight</span>
                <span class="age">age</span>
                <span class="alt">alt ft</span>
                <span class="rssi">dB</span>
            </div>
            <div id="roster-rows" class="rows"></div>
        </section>
        <section id="detail">
            <header id="detail-head">selected</header>
            <div id="detail-body" class="placeholder">nothing selected yet</div>
        </section>
    </div>

    <script src="/static/vendor/maplibre-gl.js"></script>
    <script src="/static/vendor/pmtiles.js"></script>
    <script>
        window.MAP_CONFIG = {
            center: {{ center | tojson }},
            zoom: {{ zoom | tojson }},
            rosterMinutes: {{ roster_minutes | tojson }},
            styleUrl: "/static/styles/basemap.json",
        };
    </script>
    <script src="/static/js/app.js"></script>
    <script>
        // Listen-mode gain knob: visible only while a --no-logging collector
        // heartbeats. Options come from the tuner's real supported steps.
        (function () {
            const chip = document.getElementById("gain-chip");
            const select = document.getElementById("gain-select");
            const pending = document.getElementById("gain-pending");
            let optionsReady = false;
            let waiting = false;

            async function poll() {
                let state;
                try {
                    state = await (await fetch("/api/gain")).json();
                } catch (err) {
                    chip.hidden = true;
                    return;
                }
                if (!state.alive || !state.listen_mode) {
                    chip.hidden = true;
                    return;
                }
                if (!optionsReady && state.valid_gains_db) {
                    for (const label of ["auto", ...state.valid_gains_db.map(String)]) {
                        const option = document.createElement("option");
                        option.value = label;
                        option.textContent = label;
                        select.appendChild(option);
                    }
                    optionsReady = true;
                    select.value = state.applied_gain || "auto";
                }
                chip.hidden = !optionsReady;
                if (waiting && state.applied_gain === state.requested_gain) {
                    waiting = false;
                }
                if (!waiting && state.applied_gain) {
                    select.value = state.applied_gain;
                }
                pending.textContent = waiting ? "…" : "";
            }

            select.addEventListener("change", async () => {
                waiting = true;
                pending.textContent = "…";
                await fetch("/api/gain", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        gain: select.value === "auto" ? "auto" : Number(select.value),
                    }),
                });
                poll();
            });

            setInterval(poll, 2000);
            poll();
        })();
    </script>
</body>
</html>
