<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS-B Live Map</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/vendor/maplibre-gl.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="map">
        <div id="status-chip" class="chip">connecting…</div>
    </div>
    <div id="panels">
        <section id="roster">
            <header>
                roster <span id="roster-count"></span>
                <nav class="page-nav">
                    <a href="/live">live id</a>
                    <a href="/aircraft">aircraft</a>
                    <a href="/embeddings">embeddings</a>
                </nav>
            </header>
            <div class="row head">
                <span class="dot"></span>
                <span class="icao">icao</span>
                <span class="callsign">flight</span>
                <span class="age">age</span>
                <span class="alt">alt ft</span>
                <span class="rssi">dB</span>
            </div>
            <div id="roster-rows" class="rows"></div>
        </section>
        <section id="detail">
            <header id="detail-head">selected</header>
            <div id="detail-body" class="placeholder">nothing selected yet</div>
        </section>
    </div>

    <script src="/static/vendor/maplibre-gl.js"></script>
    <script src="/static/vendor/pmtiles.js"></script>
    <script>
        window.MAP_CONFIG = {
            center: {{ center | tojson }},
            zoom: {{ zoom | tojson }},
            rosterMinutes: {{ roster_minutes | tojson }},
            styleUrl: "/static/styles/basemap.json",
        };
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
